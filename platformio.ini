; Beide Pico-W-Firmwares werden aus demselben VS-Code-Projekt gebaut.
[platformio]
default_envs = pico1-kasse, pico2-schranken

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200

[env:pico1-kasse]
build_src_filter = +<pico1/> -<pico2/>

[env:pico2-schranken]
build_src_filter = +<pico2/> -<pico1/>
