; Beide Pico-W-Firmwares werden aus demselben VS-Code-Projekt gebaut.
[platformio]
default_envs = pico1-kasse, pico2-schranken

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = rpipicow
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200

[env:pico1-kasse]
build_src_filter = +<pico1/> -<pico2/>

[env:pico2-schranken]
build_src_filter = +<pico2/> -<pico1/>

; "Pico 2" in the role names above means the SECOND controller.
; These two extra environments target the Pico 2 W (RP2350) board model.
[env:pico1-kasse-rp2350]
board = rpipico2w
build_src_filter = +<pico1/> -<pico2/>

[env:pico2-schranken-rp2350]
board = rpipico2w
build_src_filter = +<pico2/> -<pico1/>
